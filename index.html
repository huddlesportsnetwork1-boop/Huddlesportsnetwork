<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSN – Huddle Sports Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;1,800;1,900&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#0b0b0c;--ch:#151618;--ln:#2a2c30;--tx:#eceef0;--mut:#8d9299;--red:#c8102e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Source Sans 3","Helvetica Neue",Arial,sans-serif}
h1,h2,h3,.wm{font-family:Archivo,"Arial Black",Arial,sans-serif;font-style:italic;font-weight:900;margin:0;line-height:1}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wm{background:linear-gradient(#fff 50%,#aeb2b9 50%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.04em;padding-right:.08em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:3px solid var(--red);display:flex;align-items:stretch}
header .wm{font-size:30px;padding:10px 22px 10px 16px;border-right:1px solid var(--ln);display:flex;align-items:center}
nav{display:flex;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:0 16px;display:flex;align-items:center;color:var(--mut);font-weight:600;white-space:nowrap}
nav a:hover{color:var(--tx);background:var(--ch)}nav a.on{color:var(--tx);background:var(--ch);box-shadow:inset 0 -3px var(--tx)}
#acct{background:none;border:0;border-left:1px solid var(--ln);padding:0 18px;cursor:pointer;font-weight:600;white-space:nowrap}
#acct:hover{background:var(--ch)}
main{max-width:1180px;margin:0 auto;padding:0 18px 70px}
h2{font-size:26px;margin:48px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.stn{padding:70px 0 40px;border-bottom:1px solid var(--ln)}
.stn .wm{font-size:clamp(110px,26vw,300px);letter-spacing:-.06em}
.stn p{max-width:560px;font-size:20px;margin:18px 0 0;color:#c9cdd2}
.btn{background:var(--red);border:0;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:#e3173a}.btn.g{background:none;border:1px solid var(--ln)}.btn.g:hover{border-color:var(--mut)}
.mut{color:var(--mut)}
.empty{border:1px dashed var(--ln);padding:22px;color:var(--mut)}
.empty b{display:block;color:var(--tx);margin-bottom:2px}
.sched{width:100%;border-collapse:collapse}
.sched td,.sched th{padding:12px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}
.sched th{color:var(--mut);font-weight:400;font-size:14px}
.sw{display:inline-block;width:10px;height:22px;vertical-align:middle;margin-right:10px}
.tw{overflow-x:auto}
.lv{color:var(--red);font-weight:600}
.tl{columns:3 260px;column-gap:30px}
.tl a{display:block;padding:9px 0;border-bottom:1px solid var(--ln);break-inside:avoid}
.tl a:hover{padding-left:6px;transition:padding .15s}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
select,input{background:var(--ch);border:1px solid var(--ln);padding:9px 11px}
.pl{aspect-ratio:16/9;background:#000;border:1px solid var(--ln);position:relative;display:grid;place-items:center}
.pl .wm{font-size:90px;opacity:.9}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--ln);background:#000}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:26px}
@media(max-width:820px){.cols{grid-template-columns:1fr}header .wm{padding:8px 12px;font-size:26px}nav a{padding:0 12px}}
.hli:first-child{border-top:0!important;padding-top:6px!important}.nc{display:block;border:1px solid var(--ln);background:var(--ch);transition:border-color .15s}.nc:hover{border-color:var(--mut)}
.card{border:1px solid var(--ln);padding:18px;max-width:440px;display:grid;gap:10px}
footer{border-top:1px solid var(--ln);padding:22px 18px;color:var(--mut);font-size:14px;max-width:1180px;margin:0 auto}
@keyframes inn{from{transform:translateX(-70px);opacity:0;clip-path:inset(0 100% 0 0)}to{transform:none;opacity:1;clip-path:inset(0)}}.play{animation:inn .9s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(min-width:821px){
body.side{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:1fr auto;min-height:100vh}
body.side header{grid-column:1;grid-row:1/3;flex-direction:column;height:100vh;align-self:start;border-bottom:0;border-right:3px solid var(--red);background:var(--ch)}
body.side header .wm{border-right:0;border-bottom:1px solid var(--ln);padding:22px 20px 18px;font-size:54px;justify-content:flex-start}
body.side nav{flex-direction:column;flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0}
body.side nav a{padding:13px 22px;font-size:17px;border-left:3px solid transparent}
body.side nav a:hover{background:var(--bg)}
body.side nav a.on{background:var(--bg);box-shadow:none;border-left-color:var(--red)}
body.side #acct{border-left:0;border-top:1px solid var(--ln);padding:18px 22px;text-align:left}
body.side main{grid-column:2;grid-row:1;width:100%;max-width:1280px;margin:0 auto;padding:24px 48px 70px}
body.side footer{grid-column:2;grid-row:2;width:100%;max-width:1280px;margin:0 auto;padding:22px 48px}
body.side .stn{padding:30px 0 34px}body.side .stn .wm{font-size:150px}body.side .stn p{font-size:21px;max-width:640px}
body.side h2{font-size:28px}
}
</style></head><body>
<header><a href="#home" class="wm" aria-label="HSN home">HSN</a><nav id="nav"></nav><button id="acct"></button></header>
<main id="app"></main>
<footer>HSN – Huddle Sports Network. Only authorized video feeds will be carried. <a href="#admin" style="text-decoration:underline">Admin</a></footer>
<script>
var T=[["ala","Alabama","SEC","#9e1b32"],["geo","Georgia","SEC","#ba0c2f"],["tex","Texas","SEC","#bf5700"],["lsu","LSU","SEC","#461d7c"],["osu","Ohio State","Big Ten","#bb0000"],["mich","Michigan","Big Ten","#00274c"],["ore","Oregon","Big Ten","#154733"],["psu","Penn State","Big Ten","#1e407c"],["clem","Clemson","ACC","#f56600"],["mia","Miami","ACC","#f47321"],["fsu","Florida State","ACC","#782f40"],["okl","Oklahoma","Big 12","#841617"],["utah","Utah","Big 12","#cc0000"],["tcu","TCU","Big 12","#4d1979"]];
var S={games:[],partners:[],user:null,fav:[],watch:[],recent:[],cur:null,q:"Auto"};
try{var sv=JSON.parse(localStorage.getItem("hsn2")||"null");if(sv)for(var k in sv)S[k]=sv[k]}catch(e){}
var GU=false;try{GU=sessionStorage.getItem("hsn_guest")=="1"}catch(e){}
function guest(){GU=true;try{sessionStorage.setItem("hsn_guest","1")}catch(e){}if(location.hash=="#account"||!location.hash)location.hash="home";route();window.scrollTo(0,0)}
function save(){try{localStorage.setItem("hsn2",JSON.stringify(S))}catch(e){}}
var D={hl:"waiting",sc:"waiting",up:""};
function dbg(){return '<div class="empty" style="margin:14px 0"><b>Connection status</b>Firebase: '+(window.FB?"connected":"NOT connected")+' · Signed in as '+S.user.email+'<br>Highlights: '+D.hl+'<br>Schools: '+D.sc+(D.up?'<br>Last upload error: '+D.up:'')+'</div>'}
var SP={football:"Football",basketball:"Basketball",baseball:"Baseball"};
function tm(i){var t=T.find(function(x){return x[0]==i});if(t)return t;var c=(S.sc||[]).find(function(x){return x.id==i});return c?[c.id,c.n,c.sp,"#8d9299"]:[i,"Unknown school","","#8d9299"]}
function nm(i){var t=tm(i);return '<span class="sw" style="background:'+t[3]+'"></span>'+t[1]}
function dt(g){var d=new Date(g.date+"T12:00");return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function st(g){return g.s=="live"?'<span class="lv">Live</span>':g.s=="final"?'Final':'Scheduled'}
function act(g){return g.url?'<button class="btn" onclick="go('+g.id+')">'+(g.s=="final"?"Replay":"Watch")+'</button>':'<span class="mut">No stream</span>'}
function sorted(l){return l.slice().sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1})}
function table(l,empty){if(!l.length)return '<div class="empty"><b>'+empty[0]+'</b>'+empty[1]+'</div>';
return '<div class="tw"><table class="sched"><tr><th>Date</th><th>Time</th><th>Away</th><th>Home</th><th>Status</th><th></th></tr>'+sorted(l).map(function(g){return '<tr><td>'+dt(g)+'</td><td>'+g.time+'</td><td>'+nm(g.a)+'</td><td>'+nm(g.h)+'</td><td>'+st(g)+'</td><td>'+act(g)+'</td></tr>'}).join("")+'</table></div>'}
function go(id){S.cur=id;if(S.recent.indexOf(id)<0)S.recent.unshift(id);S.recent=S.recent.slice(0,8);save();location.hash="live"}
function fav(i){if(!S.user){location.hash="account";return}var x=S.fav.indexOf(i);x>-1?S.fav.splice(x,1):S.fav.push(i);save();route()}
function tl(l){return '<div class="tl">'+l.map(function(t){return '<a href="#team-'+t[0]+'">'+nm(t[0])+' <span class="mut">'+(SP[t[2]]||"")+'</span></a>'}).join("")+'</div>'}
var E={live:["Nothing on air","Live games will appear here once broadcasts begin."],up:["No games scheduled yet","The schedule opens when the first games are added."],rep:["No replays yet","Replays will be listed after the first broadcast."],hl:["No highlights yet","Highlight clips will be posted here."]};
var V={
home:function(){var g=S.games,f=g.find(function(x){return x.f});
return '<section class="stn"><div class="wm">HSN</div><p>College football, broadcast on its own terms. Live games, replays and highlights from the schools fans follow. Programming is being built now.</p></section>'
+(f?'<h2>Featured</h2>'+table([f],E.up):'')
+'<h2>Live now</h2>'+table(g.filter(function(x){return x.s=="live"}),E.live)
+'<h2>Upcoming</h2>'+table(g.filter(function(x){return x.s=="up"}).slice(0,6),E.up)


+'<h2>Highlights</h2>'+hlg(0)},
live:function(){var g=S.games.find(function(x){return x.id==S.cur});
return '<div class="cols" style="margin-top:28px"><div><div class="pl"><div class="wm">HSN</div><div class="ctl"><span class="mut">'+(g?(g.s=="live"?"Live":"On demand")+" · placeholder feed":"No broadcast selected")+'</span><span class="mut" style="margin-left:auto">Quality</span><select onchange="S.q=this.value;save()">'+["Auto","1080p","720p","480p"].map(function(q){return '<option'+(q==S.q?' selected':'')+'>'+q+'</option>'}).join("")+'</select><button class="btn g" onclick="var p=document.querySelector(\'.pl\');document.fullscreenElement?document.exitFullscreen():p.requestFullscreen&&p.requestFullscreen()">Fullscreen</button></div></div>'
+(g?'<h1 style="font-size:40px;margin-top:22px">'+tm(g.a)[1]+' at '+tm(g.h)[1]+'</h1>':'<h1 style="font-size:40px;margin-top:22px">Select a game</h1><p class="mut">Pick a game with a stream from the schedule to start watching.</p>')+'</div><aside><h3 style="font-size:20px;margin-bottom:10px">Broadcast information</h3>'+(g?'<p class="mut">'+dt(g)+', '+g.time+'<br>'+tm(g.h)[2]+'<br>Feed: '+(g.url||"placeholder")+'</p>':'<p class="mut">Details appear when a game is selected.</p>')+'</aside></div>'},
schedule:function(){var t=window.ft||"",d=window.fd||"";
var l=S.games.filter(function(g){return(!t||g.h==t||g.a==t)&&(!d||g.date==d)});
return '<h2 style="margin-top:30px">Schedule</h2><div class="bar"><input type="date" value="'+d+'" onchange="window.fd=this.value;route()" aria-label="Date"><select onchange="window.ft=this.value;route()"><option value="">All teams</option>'+(S.sc||[]).map(function(x){return '<option value="'+x.id+'"'+(x.id==t?' selected':'')+'>'+x.n+'</option>'}).join("")+'</select><button class="btn g" onclick="window.ft=window.fd=\'\';route()">Clear filters</button></div>'+table(l,E.up)},


teams:function(){return '<h2 style="margin-top:30px">Teams</h2><div class="bar">'+Object.keys(SP).map(function(k){return '<a class="btn g" href="#sport-'+k+'" style="padding:16px 26px;font-size:20px">'+SP[k]+'</a>'}).join("")+'</div>'},
sport:function(id){if(!SP[id])return V.teams();var l=(S.sc||[]).filter(function(c){return c.sp==id});return '<p style="margin:30px 0 0"><a class="mut" href="#teams">&larr; All sports</a></p><h2 style="margin-top:10px">'+SP[id]+'</h2>'+(l.length?tl(l.map(function(c){return [c.id,c.n,c.sp,"#8d9299"]})):'<div class="empty"><b>No schools yet</b>'+SP[id]+' schools will be listed here.</div>')},
about:function(){return '<h2 style="margin-top:30px">About HSN</h2><p class="mut" style="margin:0 0 20px">November 4, 2026</p><div style="max-width:640px;font-size:19px;display:grid;gap:18px"><p style="margin:0">HSN (Huddle Sports Network) is an upcoming sports network dedicated to bringing more attention to smaller college athletic programs.</p><p style="margin:0">We believe schools and athletes in organizations like the NJCAA and NAIA deserve more recognition and exposure. HSN was created to help give these programs a bigger platform by streaming college sporting events and showcasing the talent they have to offer.</p><p style="margin:0">Our goal is to begin partnering with NJCAA and NAIA programs throughout 2027, with hopes of expanding into NCAA athletics in the future.</p><p style="margin:0;font-family:Archivo,Arial,sans-serif;font-style:italic;font-weight:800;font-size:26px;border-left:3px solid var(--red);padding-left:14px">At HSN, we believe every program deserves a chance to be seen.</p></div>'},
team:function(id){var t=tm(id);if(t[1]=="Unknown school")return V.teams();var l=S.games.filter(function(g){return g.h==id||g.a==id});
return '<div style="margin:30px 0 0;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap"><span class="sw" style="background:'+t[3]+';width:18px;height:64px"></span><div><h1 style="font-size:56px">'+t[1]+'</h1><a class="mut" href="#sport-'+t[2]+'">'+(SP[t[2]]||"")+'</a></div><button class="btn g" style="margin-left:auto" onclick="fav(\''+id+'\')">'+(S.fav.indexOf(id)>-1?"Remove favorite":"Add favorite")+'</button></div><h2>Upcoming games</h2>'+table(l.filter(function(g){return g.s!="final"}),E.up)+'<h2>Past games</h2>'+table(l.filter(function(g){return g.s=="final"}),E.rep)},
graphics:function(){if(!adm())return NOA;var G=window.G=window.G||{a:"Away Team",h:"Home Team",as:0,hs:0,q:"2nd",clk:"8:42",ac:"#9e1b32",hc:"#00274c",pl:"Player Name",pt:"QB · #7 · Junior",ln:"1  Player Name  QB\n2  Player Name  RB\n3  Player Name  WR"};setTimeout(gr,0);var f=function(k,l,t){return '<label class="mut" style="display:grid;gap:3px;font-size:13px">'+l+'<input type="'+(t||"text")+'" value="'+G[k]+'" oninput="G.'+k+'=this.value;gr()"></label>'};
return '<h2 style="margin-top:30px">Broadcast graphics</h2><p class="mut" style="max-width:620px">Templates for the on-air look. Edit the fields and each graphic updates. Team names are free text, so any school works.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0">'+f("a","Away team")+f("h","Home team")+f("as","Away score","number")+f("hs","Home score","number")+f("q","Quarter")+f("clk","Clock")+f("ac","Away color","color")+f("hc","Home color","color")+f("pl","Player name")+f("pt","Player title")+'</div><label class="mut" style="display:grid;gap:3px;font-size:13px;max-width:420px">Lineup lines<textarea rows="4" oninput="G.ln=this.value;gr()" style="background:var(--ch);border:1px solid var(--ln);color:inherit;padding:9px;font:inherit">'+G.ln+'</textarea></label><div id="gp" style="display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin-top:26px"></div><h2>Intro animation</h2><div style="aspect-ratio:16/9;max-width:520px;background:#000;border:1px solid var(--ln);display:grid;place-items:center;overflow:hidden"><div id="intro" class="play" style="border-bottom:4px solid var(--red)"><span class="wm" style="font-size:96px">HSN</span></div></div><p><button class="btn g" onclick="var i=document.getElementById(\'intro\');i.classList.remove(\'play\');void i.offsetWidth;i.classList.add(\'play\')">Replay intro</button></p>'},
partners:function(){if(!adm())return NOA;var P=S.partners;return '<h2 style="margin-top:30px">School partnerships</h2><div class="bar"><input id="pn" placeholder="School name"><select id="pl2"><option>NJCAA</option><option>NAIA</option></select><button class="btn" onclick="addP()">Add school</button></div>'+(P.length?'<div class="tw"><table class="sched"><tr><th>School</th><th>Level</th><th>Contacted</th><th>Rights discussed</th><th>Written permission</th><th></th></tr>'+P.map(function(p,i){return '<tr><td>'+p.n+'</td><td class="mut">'+p.l+'</td>'+["c","r","w"].map(function(k){return '<td><input type="checkbox"'+(p[k]?' checked':'')+' onchange="S.partners['+i+'].'+k+'=this.checked;save()"></td>'}).join("")+'<td><button class="btn g" onclick="S.partners.splice('+i+',1);save();route()">Remove</button></td></tr>'}).join("")+'</table></div>':'<div class="empty"><b>No schools yet</b>Add potential NJCAA and NAIA programs here and track each step.</div>')+'<p class="mut" style="margin-top:20px">HSN broadcasts a school only after written permission.</p>'},
news:function(){return '<h2 style="margin-top:30px">News</h2><p class="mut" style="margin-bottom:14px">Latest NAIA, NCAA and NJCAA football headlines.</p>'+newsb()},
highlights:function(){return '<h2 style="margin-top:30px">Highlights</h2>'+''+hlg(1)},
contact:function(){var m="huddlesportsnetwork1@gmail.com",so=[["Instagram",""],["X",""],["Facebook",""],["YouTube",""],["TikTok","https://www.tiktok.com/@huddlesportsnetwork"]];return '<h2 style="margin-top:30px">Contact</h2><div class="cols"><div><h3 style="font-size:24px;margin-bottom:10px">Partnership inquiries</h3><p style="max-width:560px;font-size:18px;margin:0 0 18px">Are you with an NJCAA or NAIA program, a conference or an athletic department? We would like to hear from you.</p><p style="margin:0 0 6px" class="mut">Business email</p><p style="margin:0 0 22px;font-size:19px"><a href="mailto:'+m+'" style="text-decoration:underline">'+m+'</a></p><a class="btn" href="mailto:'+m+'?subject=Partnership%20Inquiry" style="display:inline-block">Partner With HSN</a></div><aside><h3 style="font-size:20px;margin-bottom:8px">About HSN</h3><p class="mut" style="margin:0 0 6px">An upcoming network giving smaller college programs a bigger platform.</p><p style="margin:0 0 28px"><a href="#about" style="text-decoration:underline">Read more</a></p><h3 style="font-size:20px;margin-bottom:8px">Follow HSN</h3><div class="tl" style="columns:1">'+so.map(function(s){return s[1]?'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a>':'<a style="pointer-events:none">'+s[0]+' <span class="mut">Coming soon</span></a>'}).join("")+'</div></aside></div>'},
